name: Beyond core — actual renderer compiler A-B
on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'compiler (Oz/O2), or hoist (pure per-draw preparation)'
        type: choice
        options: [compiler, hoist]
        default: compiler
permissions:
  contents: read
jobs:
  renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: echo "EMSDK_VERSION=$(cat EMSDK_VERSION)" >> "$GITHUB_ENV"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
      - name: Build renderer experiment outside shared sources
        env:
          KIND: ${{ inputs.kind }}
        run: |
          set -euo pipefail
          scripts/apply_patches.sh
          mkdir -p "$RUNNER_TEMP/results"
          em++ upstream/melee-unlocked/port/runtime/gx/gx_texture.cpp -std=c++17 -O2 \
            -ffp-contract=off -fno-fast-math -fwasm-exceptions -c -o "$RUNNER_TEMP/texture.o"
          for label in baseline candidate; do
            opt=-Oz
            source=wasm/render/gx_webgpu.cpp
            if [ "$KIND" = hoist ]; then
              python3 experiments/renderer/prepare.py "$label"
              source="$RUNNER_TEMP/$label-renderer.cpp"
            elif [ "$label" = candidate ]; then opt=-O2; fi
            em++ "$source" wasm/render/gx_wgsl.cpp \
              "$RUNNER_TEMP/texture.o" experiments/renderer/host.cpp \
              -Inative -I. -Iwasm/render -Iwasm/compat -Iupstream/melee-unlocked/port/runtime/host -Iupstream/melee-unlocked/port/runtime/ppc \
              -Iupstream/melee-unlocked/port/runtime/gx -Iupstream/melee-unlocked/native \
              -std=c++17 "$opt" -ffp-contract=off -fno-fast-math -fwasm-exceptions \
              -sMODULARIZE=1 -sEXPORT_ES6=1 -sENVIRONMENT=web -sALLOW_MEMORY_GROWTH=1 \
              -sINITIAL_MEMORY=64MB --no-entry -o "$RUNNER_TEMP/$label.mjs"
          done
          git diff --exit-code -- wasm/render
      - name: Browser measurements and pixel equality
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.56.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
          cp experiments/renderer/bench.mjs "$RUNNER_TEMP/browser/bench.mjs"
          node "$RUNNER_TEMP/browser/bench.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beyond-renderer
          path: ${{ runner.temp }}/results
          retention-days: 7
