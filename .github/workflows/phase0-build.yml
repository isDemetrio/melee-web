name: Phase 0 — WASM core
on:
  workflow_dispatch:
    inputs:
      upload_module:
        description: 'Upload the linked Node module as a private artifact (game-derived; see docs/PHASE0_TASKS.md D3)'
        type: boolean
        default: false
      upload_spike:
        description: 'Upload the spike page and web core as a private artifact (game-derived; S6)'
        type: boolean
        default: false
      opt_level:
        description: 'Optimisation level for the core (docs/OPT_LEVEL_EXPERIMENT.md). -Oz is the shipped default; the others exist to measure what the level costs in speed and size.'
        type: choice
        options:
          - '-Oz'
          - '-O1'
          - '-O2'
          - '-O3'
        default: '-Oz'
  pull_request:
    paths:
      - 'web/spike.html'
      - 'web/src/spike/**'
      - 'web/tests/spike/**'
      - 'web/playwright.spike.config.ts'
      - 'web/public/sw.js'
      - 'web/vite.config.ts'
      - 'wasm/**'
      - 'native/**'
      - 'patches/**'
      # Only the scripts the build actually uses. The whole of scripts/phase0/** used to be
      # listed, which meant that editing an unrelated tool — the checkpoint comparator, say —
      # cost a 35-minute WASM build.
      - 'scripts/phase0/time_compile.sh'
      - 'scripts/phase0/fetch_and_recompile.sh'
      - 'scripts/phase0/compile_report.py'
      - 'scripts/phase0/wasm_report.py'
      - 'scripts/apply_patches.sh'
      - 'EMSDK_VERSION'
      - 'upstream/melee-unlocked'
      - '.github/workflows/phase0-build.yml'
permissions:
  contents: read
concurrency:
  group: wasm-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Fetch, verify, patch and generate release and offline guests
        env:
          GH_TOKEN: ${{ secrets.DOL_REPO_TOKEN }}
        run: scripts/phase0/fetch_and_recompile.sh both "$RUNNER_TEMP/generated"
      - name: Read emsdk pin
        run: echo "EMSDK_VERSION=$(cat EMSDK_VERSION)" >> "$GITHUB_ENV"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
      - name: Budget compilation from available memory
        run: |
          # Reserve 2 GiB for OS/linker; budget 1 GiB per compiler. Cap at 4 to bound contention.
          available=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)
          jobs=$(( (available - 2097152) / 1048576 ))
          if (( jobs < 1 )); then jobs=1; fi
          if (( jobs > 4 )); then jobs=4; fi
          echo "BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "MELEE_COMPILE_CSV=$RUNNER_TEMP/compile.csv" >> "$GITHUB_ENV"
          echo 'tu,seconds,max_rss_kb,object_bytes,status,variant' > "$RUNNER_TEMP/compile.csv"
          date +%s > "$RUNNER_TEMP/build-start"
          { nproc; free -m; echo "MemAvailable_KiB=$available ninja_jobs=$jobs"; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compile minimum upstream runtime with host clang
        run: |
          cmake -S wasm/core -B "$RUNNER_TEMP/clang" -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ -DMELEE_GEN="$RUNNER_TEMP/generated"
          cmake --build "$RUNNER_TEMP/clang" --target runtime_core sha1_test --parallel "$BUILD_JOBS"
          "$RUNNER_TEMP/clang/sha1_test"
      - name: Compile and link WASM offline core and minimum upstream runtime
        run: |
          emcmake cmake -S wasm/core -B "$RUNNER_TEMP/wasm" -G Ninja \
            -DMELEE_GEN="$RUNNER_TEMP/generated" \
            -DMELEE_OPT="${{ inputs.opt_level || '-Oz' }}" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$GITHUB_WORKSPACE/scripts/phase0/time_compile.sh"
          echo "opt_level=${{ inputs.opt_level || '-Oz' }}" | tee -a "$GITHUB_STEP_SUMMARY"
          SECONDS=0
          cmake --build "$RUNNER_TEMP/wasm" --target guest runtime_core melee_core_wasm sha1_test --parallel "$BUILD_JOBS"
          echo "offline_compile_link_seconds=$SECONDS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compile all 144 release guest TUs with emcc (P0-04)
        run: |
          emcmake cmake -S wasm/core -B "$RUNNER_TEMP/wasm-release" -G Ninja \
            -DMELEE_GEN="$RUNNER_TEMP/generated-release" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$GITHUB_WORKSPACE/scripts/phase0/time_compile.sh"
          SECONDS=0
          MELEE_COMPILE_LABEL=release cmake --build "$RUNNER_TEMP/wasm-release" --target guest --parallel "$BUILD_JOBS"
          echo "release_guest_compile_seconds=$SECONDS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: WASM imports, sizes and Node smoke (no ISO)
        run: |
          node "$RUNNER_TEMP/wasm/sha1_test.js"
          node "$RUNNER_TEMP/wasm/melee_core_node.js" --help
          node "$RUNNER_TEMP/wasm/melee_core_node.js" --check-dol "$RUNNER_TEMP/dol/main.dol"
          if node "$RUNNER_TEMP/wasm/melee_core_node.js" --iso /nonexistent --frames 1 > "$RUNNER_TEMP/smoke.log" 2>&1; then
            echo 'missing ISO unexpectedly accepted'; exit 1
          fi
          cat "$RUNNER_TEMP/smoke.log"
          grep -q 'cannot open ISO /nonexistent' "$RUNNER_TEMP/smoke.log"
          # --sim-times is reported before the ISO checks, so it fires even with a bad ISO path.
          node "$RUNNER_TEMP/wasm/melee_core_node.js" --help > "$RUNNER_TEMP/help.txt"
          grep -q -- '--sim-times' "$RUNNER_TEMP/help.txt"
          if node "$RUNNER_TEMP/wasm/melee_core_node.js" --iso /nonexistent --frames 1 --sim-times "$RUNNER_TEMP/st.csv" > "$RUNNER_TEMP/st.log" 2>&1; then
            echo '--sim-times without --fast accepted'; exit 1
          fi
          grep -q -- '--sim-times requires --fast' "$RUNNER_TEMP/st.log"
          for platform in node web; do
            python3 scripts/phase0/wasm_report.py "$RUNNER_TEMP/wasm/melee_core_$platform.wasm" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the spike page around the web core (P0-10)
        working-directory: web
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npx tsc --noEmit
          npx vite build --outDir "$RUNNER_TEMP/spike-dist" --emptyOutDir
          mkdir -p "$RUNNER_TEMP/spike-dist/spike-core"
          cp "$RUNNER_TEMP/wasm/melee_core_web.js" "$RUNNER_TEMP/wasm/melee_core_web.wasm" "$RUNNER_TEMP/spike-dist/spike-core/"
          cp "$GITHUB_WORKSPACE/upstream/melee-unlocked/port/scripts/parity_vs_onett.txt" "$RUNNER_TEMP/spike-dist/spike-core/"
          # Read the level CMake actually configured with, not a guess at it. The field was first
          # hardcoded to "-O1", then grepped out of the build definition — which matched the first
          # -O token anywhere in that file, including the "-O1" mentioned in a comment, so a core
          # built at another level could still declare itself "-O1". wasm/core/CMakeLists.txt writes
          # MELEE_OPT to melee_opt.txt at configure time; the grep stays only as a fallback.
          opt_file="$RUNNER_TEMP/wasm/melee_opt.txt"
          if [ -f "$opt_file" ]; then
            opt=$(cat "$opt_file")
          else
            opt=$(grep -m1 -oE -- '-O[a-z0-9]+' "$GITHUB_WORKSPACE/wasm/core/CMakeLists.txt")
          fi
          printf '{"commit":"%s","opt":"%s"}\n' "$GITHUB_SHA" "$opt" > "$RUNNER_TEMP/spike-dist/spike-core/core.json"
          cat "$RUNNER_TEMP/spike-dist/spike-core/core.json"
      - name: Spike harness in Chromium with a synthetic disc header (no ISO)
        working-directory: web
        env:
          SPIKE_DIST: ${{ runner.temp }}/spike-dist
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.spike.config.ts
      - name: Numeric compilation report (also on failure)
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/build-start"; then
            elapsed=$(( $(date +%s) - $(cat "$RUNNER_TEMP/build-start") ))
            python3 scripts/phase0/compile_report.py "$RUNNER_TEMP/compile.csv" "$elapsed" | tee -a "$GITHUB_STEP_SUMMARY"
            find "$RUNNER_TEMP/wasm" "$RUNNER_TEMP/wasm-release" -name '*.a' -printf '%f %s bytes\n' 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          fi
      - name: Repository hygiene
        run: python3 scripts/check_no_game_data.py --all
      # Same narrow exception as the native workflow, and for the same reason: the machine that
      # edits this repository cannot compile, and no CI runner has the disc image, so an
      # opt-in private artifact is the only route by which the linked module can be run against
      # the operator's own disc. Off for every pull request, off by default, three days.
      # See docs/PHASE0_TASKS.md D3.
      - name: Upload the Node module (opt-in private artifact)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_module }}
        uses: actions/upload-artifact@v4
        with:
          name: melee-core-wasm-node
          path: |
            ${{ runner.temp }}/wasm/melee_core_node.js
            ${{ runner.temp }}/wasm/melee_core_node.wasm
          retention-days: 3
          if-no-files-found: error
      # Otherwise no guest-derived build products or caches are uploaded: only Actions logs.
      - name: Upload the spike page with its core (opt-in private artifact)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_spike }}
        uses: actions/upload-artifact@v4
        with:
          name: melee-spike-dist
          path: ${{ runner.temp }}/spike-dist
          retention-days: 3
          if-no-files-found: error
