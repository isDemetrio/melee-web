name: Phase 0 — WASM core
on:
  workflow_dispatch:
    inputs:
      diagnostic_build_run:
        description: Temporary private spike artifact source for hang diagnosis
        type: string
        default: ""
      upload_module:
        description: 'Upload the linked Node module as a private artifact (game-derived; see docs/PHASE0_TASKS.md D3)'
        type: boolean
        default: false
      upload_spike:
        description: 'Upload the spike page and web core as a private artifact (game-derived; S6)'
        type: boolean
        default: false
      opt_level:
        description: 'Optimisation level for the core (docs/OPT_LEVEL_EXPERIMENT.md). -Oz is the shipped default; the others exist to measure what the level costs in speed and size.'
        type: choice
        options:
          - '-Oz'
          - '-O1'
          - '-O2'
          - '-O3'
        default: '-Oz'
      deploy_spike:
        description: 'Publish the spike page as a Cloudflare Pages preview (needs CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and CF_PAGES_PROJECT; skips with a warning without them). The dist carries the game-derived module, so this also needs the operator decision O1.'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'web/spike.html'
      - 'web/src/spike/**'
      - 'web/tests/spike/**'
      - 'web/playwright.spike.config.ts'
      - 'web/public/sw.js'
      # web/vite.config.ts is deliberately not here. This workflow's spike step reads it -- it
      # runs `npx vite build` -- but that is not a reason to rebuild the WASM core for an edit to
      # it: ci.yml has no path filter and runs `npx tsc --noEmit`, `npx vite build` with this same
      # config and the same two entries, and the browser tests on every pull request. What the
      # spike step added for a config-only change was the spike page's own invariants, and those
      # are asserted where every pull request runs instead: ci.yml's build guard asserts that
      # dist/spike.html exists, and web/tests/unit/build-config.test.ts asserts outDir, both
      # entries, `worker.format: 'es'` and the isolation headers. The cost of the old behaviour,
      # measured: the pull request that changed this file (PR #42, runs 36965278604 and
      # 36965993838) paid 5m34s and 5m47s of WASM core build for it.
      # The probe (wasm/probe) is a CMake project of its own: webgpu-probe.yml builds it and no
      # target this workflow compiles reads it, so a change under it must not cost a 35-minute WASM
      # core build -- the same rule the scripts/phase0 list below already follows.
      - 'wasm/compat/**'
      - 'wasm/core/**'
      - 'wasm/render/**'
      - 'native/**'
      - 'patches/**'
      # Only the scripts the build actually uses. The whole of scripts/phase0/** used to be
      # listed, which meant that editing an unrelated tool — the checkpoint comparator, say —
      # cost a 35-minute WASM build.
      - 'scripts/phase0/time_compile.sh'
      - 'scripts/phase0/fetch_and_recompile.sh'
      - 'scripts/phase0/compile_report.py'
      - 'scripts/phase0/wasm_report.py'
      - 'scripts/apply_patches.sh'
      - 'EMSDK_VERSION'
      - 'upstream/melee-unlocked'
      - '.github/workflows/phase0-build.yml'
permissions:
  contents: read
concurrency:
  group: wasm-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ !inputs.diagnostic_build_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # One place decides the level: the dispatch input, or -Oz for every other event (pull
      # requests have no inputs). wasm/core/CMakeLists.txt writes it back out to melee_opt.txt, and
      # core.json is filled from that file, so the field reports what CMake configured with rather
      # than what the workflow intended.
      MELEE_OPT: ${{ inputs.opt_level || '-Oz' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Fetch, verify, patch and generate release and offline guests
        env:
          GH_TOKEN: ${{ secrets.DOL_REPO_TOKEN }}
        run: scripts/phase0/fetch_and_recompile.sh both "$RUNNER_TEMP/generated"
      - name: Read emsdk pin
        run: echo "EMSDK_VERSION=$(cat EMSDK_VERSION)" >> "$GITHUB_ENV"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
      - name: Budget compilation from available memory
        run: |
          # Reserve 2 GiB for OS/linker; budget 1 GiB per compiler. Cap at 4 to bound contention.
          available=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)
          jobs=$(( (available - 2097152) / 1048576 ))
          if (( jobs < 1 )); then jobs=1; fi
          if (( jobs > 4 )); then jobs=4; fi
          echo "BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "MELEE_COMPILE_CSV=$RUNNER_TEMP/compile.csv" >> "$GITHUB_ENV"
          echo 'tu,seconds,max_rss_kb,object_bytes,status,variant' > "$RUNNER_TEMP/compile.csv"
          date +%s > "$RUNNER_TEMP/build-start"
          { nproc; free -m; echo "MemAvailable_KiB=$available ninja_jobs=$jobs"; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Name the artifacts after the level
        run: |
          # An artifact called melee-core-wasm-node says nothing about the level inside it, and two
          # dispatches at different levels would produce two indistinguishable downloads. The
          # default keeps the documented name (docs/PHASE0_TASKS.md D3); other levels get a suffix.
          suffix=""
          # The level already starts with a dash: stripping it keeps the artifact name
          # melee-core-wasm-node-O1 rather than ...-node--O1, which is what the first dispatch
          # produced.
          if [ "$MELEE_OPT" != "-Oz" ]; then suffix="-${MELEE_OPT#-}"; fi
          {
            echo "NODE_ARTIFACT=melee-core-wasm-node$suffix"
            echo "SPIKE_ARTIFACT=melee-spike-dist$suffix"
          } >> "$GITHUB_ENV"
      - name: Compile minimum upstream runtime with host clang
        run: |
          cmake -S wasm/core -B "$RUNNER_TEMP/clang" -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ -DMELEE_GEN="$RUNNER_TEMP/generated" \
            -DMELEE_OPT="$MELEE_OPT"
          cmake --build "$RUNNER_TEMP/clang" --target runtime_core sha1_test --parallel "$BUILD_JOBS"
          "$RUNNER_TEMP/clang/sha1_test"
      - name: Compile and link WASM offline core and minimum upstream runtime
        run: |
          emcmake cmake -S wasm/core -B "$RUNNER_TEMP/wasm" -G Ninja \
            -DMELEE_GEN="$RUNNER_TEMP/generated" \
            -DMELEE_OPT="$MELEE_OPT" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$GITHUB_WORKSPACE/scripts/phase0/time_compile.sh"
          echo "opt_level=$MELEE_OPT" | tee -a "$GITHUB_STEP_SUMMARY"
          # The two hot translation units are moved to -O2 by a source property, and the whole
          # mechanism is that CMake appends source options after the target's own and interface
          # options. Read the real compile commands instead of trusting that ordering: if it ever
          # changes, -Oz would win and the experiment would measure nothing (docs/FRAME_TIME_CONSULT.md).
          bash scripts/phase0/assert_hot_opt.sh "$RUNNER_TEMP/wasm/compile_commands.json" -O2 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          SECONDS=0
          cmake --build "$RUNNER_TEMP/wasm" --target guest runtime_core melee_core_wasm sha1_test --parallel "$BUILD_JOBS"
          echo "offline_compile_link_seconds=$SECONDS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Post-process the shipped modules with wasm-opt
        run: |
          # Emscripten already runs Binaryen at link, and a second pass still pays: measured on the
          # -Oz node module it is 7.1% smaller (16,323,657 -> 15,162,083 bytes) and 4.6% faster
          # in-match on the reference machine, with all 2400 checkpoints still identical
          # (docs/WASM_OPT_EXPERIMENT.md). Both the size and the speed matter here: Pages allows
          # 26,214,400 bytes per file and -O1 was closed at 85,658,030.
          #
          # The feature list is explicit on purpose. `--all-features` produces a module that Node
          # and V8 reject at instantiation ("unknown import kind 0x7f"), and nothing in the build
          # notices until something tries to load it. So the flags stay spelled out, and the
          # compile check below is part of the step rather than a nicety.
          #
          # The level is -O2, not -O3: the pass is the JS build of Binaryen here, and -O3 on a
          # 16 MB module took minutes of runner time for no measured gain.
          npm install -g binaryen@132.0.0
          for module in "$RUNNER_TEMP/wasm/melee_core_node.wasm" "$RUNNER_TEMP/wasm/melee_core_web.wasm"; do
            before=$(stat -c%s "$module")
            wasm-opt --enable-bulk-memory --enable-mutable-globals \
              --enable-nontrapping-float-to-int --enable-sign-ext --enable-exception-handling \
              -O2 "$module" -o "$module.opt"
            mv "$module.opt" "$module"
            echo "wasm-opt: $(basename "$module") $before -> $(stat -c%s "$module") bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          # The loader finds its module by name beside the .js, so a module that no longer
          # instantiates would ship a page that dies on load with no other symptom. Compile both
          # with the engine that will run them; the Node smoke test later in this job then runs the
          # node module for real.
          node -e '
            const fs = require("fs");
            const files = process.argv.slice(1);
            Promise.all(files.map(f => WebAssembly.compile(fs.readFileSync(f))
              .then(() => console.log(f.split("/").pop() + ": compiles"))
              .catch(e => { console.error(f.split("/").pop() + ": " + e.message); process.exit(1); })))
              .catch(() => process.exit(1));
          ' "$RUNNER_TEMP/wasm/melee_core_node.wasm" "$RUNNER_TEMP/wasm/melee_core_web.wasm"
      - name: Compile all 144 release guest TUs with emcc (P0-04)
        run: |
          emcmake cmake -S wasm/core -B "$RUNNER_TEMP/wasm-release" -G Ninja \
            -DMELEE_GEN="$RUNNER_TEMP/generated-release" \
            -DMELEE_OPT="$MELEE_OPT" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$GITHUB_WORKSPACE/scripts/phase0/time_compile.sh"
          SECONDS=0
          MELEE_COMPILE_LABEL=release cmake --build "$RUNNER_TEMP/wasm-release" --target guest --parallel "$BUILD_JOBS"
          echo "release_guest_compile_seconds=$SECONDS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: WASM imports, sizes and Node smoke (no ISO)
        run: |
          node "$RUNNER_TEMP/wasm/sha1_test.js"
          node "$RUNNER_TEMP/wasm/melee_core_node.js" --help
          node "$RUNNER_TEMP/wasm/melee_core_node.js" --check-dol "$RUNNER_TEMP/dol/main.dol"
          if node "$RUNNER_TEMP/wasm/melee_core_node.js" --iso /nonexistent --frames 1 > "$RUNNER_TEMP/smoke.log" 2>&1; then
            echo 'missing ISO unexpectedly accepted'; exit 1
          fi
          cat "$RUNNER_TEMP/smoke.log"
          grep -q 'cannot open ISO /nonexistent' "$RUNNER_TEMP/smoke.log"
          # --sim-times is reported before the ISO checks, so it fires even with a bad ISO path.
          node "$RUNNER_TEMP/wasm/melee_core_node.js" --help > "$RUNNER_TEMP/help.txt"
          grep -q -- '--sim-times' "$RUNNER_TEMP/help.txt"
          if node "$RUNNER_TEMP/wasm/melee_core_node.js" --iso /nonexistent --frames 1 --sim-times "$RUNNER_TEMP/st.csv" > "$RUNNER_TEMP/st.log" 2>&1; then
            echo '--sim-times without --fast accepted'; exit 1
          fi
          grep -q -- '--sim-times requires --fast' "$RUNNER_TEMP/st.log"
          for platform in node web; do
            python3 scripts/phase0/wasm_report.py "$RUNNER_TEMP/wasm/melee_core_$platform.wasm" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the spike page around the web core (P0-10)
        working-directory: web
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npx tsc --noEmit
          npx vite build --outDir "$RUNNER_TEMP/spike-dist" --emptyOutDir
          mkdir -p "$RUNNER_TEMP/spike-dist/spike-core"
          cp "$RUNNER_TEMP/wasm/melee_core_web.js" "$RUNNER_TEMP/wasm/melee_core_web.wasm" "$RUNNER_TEMP/spike-dist/spike-core/"
          cp "$GITHUB_WORKSPACE/upstream/melee-unlocked/port/scripts/parity_vs_onett.txt" "$RUNNER_TEMP/spike-dist/spike-core/"
          # Read the level CMake actually configured with, not a guess at it. The field was first
          # hardcoded to "-O1", then grepped out of the build definition — which matched the first
          # -O token anywhere in that file, including the "-O1" mentioned in a comment, so a core
          # built at another level could still declare itself "-O1". wasm/core/CMakeLists.txt writes
          # MELEE_OPT to melee_opt.txt at configure time; the grep stays only as a fallback.
          opt_file="$RUNNER_TEMP/wasm/melee_opt.txt"
          if [ -f "$opt_file" ]; then
            opt=$(cat "$opt_file")
          else
            opt=$(grep -m1 -oE -- '-O[a-z0-9]+' "$GITHUB_WORKSPACE/wasm/core/CMakeLists.txt")
          fi
          printf '{"commit":"%s","opt":"%s"}\n' "$GITHUB_SHA" "$opt" > "$RUNNER_TEMP/spike-dist/spike-core/core.json"
          cat "$RUNNER_TEMP/spike-dist/spike-core/core.json"
      - name: Spike harness in Chromium with a synthetic disc header (no ISO)
        working-directory: web
        env:
          SPIKE_DIST: ${{ runner.temp }}/spike-dist
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.spike.config.ts --max-failures=1
      - name: Upload synthetic page report (no game data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-instrumentation-report
          path: web/test-results/**/play-report.json
          if-no-files-found: warn
          retention-days: 3
      # The backend's pixel pipeline -- TEV, fog, alpha test, blending, EFB copies to textures --
      # read back off the same Chromium WebGPU device with the same page (probes 15 and 40-51 of
      # gx_webgpu_selftest). The script says why it is not a case in render.spec.ts yet.
      - name: TEV, fog, alpha test and blending in Chromium (no ISO)
        env:
          SPIKE_DIST: ${{ runner.temp }}/spike-dist
        run: node wasm/render/pixel_pipeline_check.mjs
      - name: Numeric compilation report (also on failure)
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/build-start"; then
            elapsed=$(( $(date +%s) - $(cat "$RUNNER_TEMP/build-start") ))
            python3 scripts/phase0/compile_report.py "$RUNNER_TEMP/compile.csv" "$elapsed" | tee -a "$GITHUB_STEP_SUMMARY"
            find "$RUNNER_TEMP/wasm" "$RUNNER_TEMP/wasm-release" -name '*.a' -printf '%f %s bytes\n' 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
          fi
      - name: Repository hygiene
        run: python3 scripts/check_no_game_data.py --all
      # Same narrow exception as the native workflow, and for the same reason: the machine that
      # edits this repository cannot compile, and no CI runner has the disc image, so an
      # opt-in private artifact is the only route by which the linked module can be run against
      # the operator's own disc. Off for every pull request, off by default, three days.
      # See docs/PHASE0_TASKS.md D3.
      - name: Upload the Node module (opt-in private artifact)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.upload_module }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NODE_ARTIFACT }}
          path: |
            ${{ runner.temp }}/wasm/melee_core_node.js
            ${{ runner.temp }}/wasm/melee_core_node.wasm
          retention-days: 3
          if-no-files-found: error
      # Otherwise no guest-derived build products or caches are uploaded: only Actions logs.
      - name: Upload the spike page with its core (opt-in private artifact)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.upload_spike }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SPIKE_ARTIFACT }}
          path: ${{ runner.temp }}/spike-dist
          retention-days: 3
          if-no-files-found: error
      # The preview is the only thing in this repository that would put the game-derived module on
      # the public internet, so it is off by default, it needs its own dispatch input, and it skips
      # with a warning instead of failing the job when the credentials are absent (the same shape
      # as the deploy job in ci.yml). It also needs the operator's decision O1
      # (docs/PHASE0_DEPLOY_PLAN.md section 3): with credentials set, dispatching this input
      # publishes the module, so the credentials are the second lock, not the first.
      - name: Publish the spike preview (opt-in, needs Cloudflare credentials)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_spike }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "${CF_PAGES_PROJECT:-}" ] || missing="$missing CF_PAGES_PROJECT"
          if [ -n "$missing" ]; then
            echo "deploy skipped: not set:$missing" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "  Credentials and project variable: docs/PHASE0_DEPLOY_PLAN.md section 3 (O5), docs/DEPLOY.md." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The shell's service worker must not travel with the spike preview: one registered by an
          # earlier visit keeps serving the cached shell, and the page would then be the wrong one.
          rm -f "$RUNNER_TEMP/spike-dist/sw.js"
          # /spike-core/* must not inherit the site-wide immutable rule for *.wasm. The module keeps
          # a fixed file name, so a cached copy outlives a rebuild and a phone would run the previous
          # core while core.json announces the new commit (deploy plan section 0, first defect).
          # Whether Pages merges two matching rules or lets the later one win is unverified; the `!`
          # line detaches the header either way. Verify after the first deploy with
          # curl -sI .../spike-core/melee_core_web.wasm: it must not show `immutable`.
          printf '\n/spike-core/*\n  ! Cache-Control\n  Cache-Control: no-store\n' >> "$RUNNER_TEMP/spike-dist/_headers"
          # deploy.sh refuses a dirty tree, so the deployed shell is a commit rather than somebody's
          # working copy. This job's tree is dirty by design once the build has run -- the patch step
          # moves the submodule's checkout, which shows up as a modified submodule whatever the
          # submodule itself contains, and npm writes a lockfile -- and undoing that is guesswork
          # about what the build did. Publish from a clean copy of the commit instead: the dist is
          # already built, and deploy.sh reads the checkout only to answer "is this a commit?".
          git clone --quiet --no-hardlinks "$GITHUB_WORKSPACE" "$RUNNER_TEMP/clean"
          git -C "$RUNNER_TEMP/clean" status --porcelain | sed 's/^/  in the clean copy: /'
          scripts/deploy.sh --branch phase0-spike --repo-dir "$RUNNER_TEMP/clean" --dist-dir "$RUNNER_TEMP/spike-dist" | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' "$RUNNER_TEMP/deploy.log" | tail -1)
          echo "spike preview: ${url:-not reported by wrangler}" | tee -a "$GITHUB_STEP_SUMMARY"

  diagnose:
    permissions:
      contents: read
      actions: read
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_build_run != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: melee-spike-dist
          path: ${{ runner.temp }}/spike-dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.diagnostic_build_run }}
      - working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Controlled shader experiments on the same built module
        env:
          SPIKE_DIST: ${{ runner.temp }}/spike-dist
        run: node scripts/diagnostic/lit-hang.mjs
