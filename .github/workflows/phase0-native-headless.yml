name: Phase 0 — Linux headless reference (offline)
on:
  workflow_dispatch:
    inputs:
      upload_binary:
        description: 'Upload the built executable as a private artifact (game-derived; see docs/PHASE0_TASKS.md D3)'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'native/**'
      - 'patches/**'
      - 'wasm/compat/**'
      - 'scripts/apply_patches.sh'
      - 'scripts/phase0/fetch_and_recompile.sh'
      - 'upstream/melee-unlocked'
      - '.github/workflows/phase0-native-headless.yml'
permissions:
  contents: read
concurrency:
  group: native-headless-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Fetch, verify, patch and generate offline guest (shared pipeline)
        env:
          GH_TOKEN: ${{ secrets.DOL_REPO_TOKEN }}
        run: scripts/phase0/fetch_and_recompile.sh offline "$RUNNER_TEMP/generated-native"
      - name: Build Linux headless executable
        run: |
          cmake -S native -B "$RUNNER_TEMP/build-native" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++ \
            -DPORT_GEN="$RUNNER_TEMP/generated-native"
          cmake --build "$RUNNER_TEMP/build-native" --target melee_core_headless native_fifo_test --parallel 2
          ctest --test-dir "$RUNNER_TEMP/build-native" --output-on-failure
      - name: CLI and DOL smoke checks (no simulation without ISO)
        run: |
          set -euo pipefail
          exe="$RUNNER_TEMP/build-native/melee_core_headless"
          "$exe" --help
          "$exe" --check-dol "$RUNNER_TEMP/dol/main.dol"
          if "$exe" --iso missing.iso --frames 0; then exit 1; fi
          # --sim-times is reported before the ISO checks, so it fires even with a bad ISO path.
          "$exe" --help > "$RUNNER_TEMP/help.txt"
          grep -q -- '--sim-times' "$RUNNER_TEMP/help.txt"
          if "$exe" --iso missing.iso --frames 1 --sim-times "$RUNNER_TEMP/st.csv" > "$RUNNER_TEMP/st.log" 2>&1; then
            echo '--sim-times without --fast accepted'; exit 1
          fi
          grep -q -- '--sim-times requires --fast' "$RUNNER_TEMP/st.log"
          if "$exe" --hidden; then exit 1; fi
          echo 'Build/CLI checks only. ISO boot, 2400-frame run and Windows parity remain unverified.' >> "$GITHUB_STEP_SUMMARY"
      - name: Repository hygiene
        run: python3 scripts/check_no_game_data.py --all
      # No binary/guest artifacts by default: these contain game code. Only Actions logs are
      # retained. The exception is opt-in and one run at a time: the machine that edits this
      # repository cannot compile, and CI has no disc image, so a private artifact is the only
      # route by which the operator's own copy of the disc can produce a checkpoint trace.
      # See docs/PHASE0_TASKS.md D3.
      - name: Upload the reference executable (opt-in private artifact)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_binary }}
        uses: actions/upload-artifact@v4
        with:
          name: melee-core-headless
          path: ${{ runner.temp }}/build-native/melee_core_headless
          retention-days: 3
          if-no-files-found: error
