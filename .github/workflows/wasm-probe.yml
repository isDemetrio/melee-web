name: WASM toolchain probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'wasm/**'
      - 'patches/**'
      - 'EMSDK_VERSION'
      - 'scripts/apply_patches.sh'
      - 'scripts/phase0/compare_wasm_arch.py'
      - '.github/workflows/wasm-probe.yml'
      - 'docs/UPSTREAM_PIN.md'
      - 'upstream/melee-unlocked'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Runner and pin
        id: pin
        shell: bash
        run: |
          nproc
          free -m
          df -h
          python3 - <<'PY'
          import pathlib, re, subprocess, os
          text = pathlib.Path('docs/UPSTREAM_PIN.md').read_text()
          match = re.search(r'\| Pinned commit \| `([0-9a-f]{40})` \|', text)
          assert match, 'Missing authoritative upstream pin'
          head = subprocess.check_output(['git', '-C', 'upstream/melee-unlocked', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == match[1], (head, match[1])
          version = pathlib.Path('EMSDK_VERSION').read_text()
          assert re.fullmatch(r'\d+\.\d+\.\d+\n', version), 'Expected one pinned release line'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('emsdk=' + version)
          PY
          python3 scripts/check_no_game_data.py --all
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ steps.pin.outputs.emsdk }}
      - name: Native baseline from unpatched upstream
        shell: bash
        run: |
          mkdir -p wasm-probe/out/native
          git -C upstream/melee-unlocked diff --exit-code
          for source in fma_vectors bench; do
            g++ -std=c++17 -O2 -mfma -ffp-contract=off -fno-fast-math \
              -Iwasm/compat -Iupstream/melee-unlocked/port/runtime/ppc \
              "wasm/probe/$source.cpp" -o "wasm-probe/out/native/$source"
          done
          wasm-probe/out/native/fma_vectors --dump wasm-probe/native.bin > wasm-probe/native.sha256
          wasm-probe/out/native/bench > wasm-probe/native-bench.json
      - name: Patch and build WASM
        shell: bash
        run: |
          bash scripts/apply_patches.sh
          emcmake cmake -S wasm/probe -B wasm-probe/out/wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build wasm-probe/out/wasm --parallel 2
      - name: Run upstream tests under Node
        run: |
          # The emcc output is CommonJS, but Node walks up from this directory and finds the
          # repository package.json with "type": "module", so it parses these generated files
          # as ES modules and dies on `require is not defined`. Pin the interpretation for the
          # generated directory only, rather than dropping "type": "module" from the root.
          printf '{"type":"commonjs"}\n' > wasm-probe/out/wasm/package.json
          ctest --test-dir wasm-probe/out/wasm --output-on-failure
      - name: Measure WASM and publish benchmark summary
        shell: bash
        run: |
          node wasm-probe/out/wasm/fma_vectors.js --dump wasm-probe/wasm.bin > wasm-probe/wasm.sha256
          node wasm-probe/out/wasm/bench.js > wasm-probe/wasm-bench.json
          python3 - <<'PY'
          import json, os, pathlib, platform, subprocess
          root = pathlib.Path('wasm-probe')
          result = {
              'emsdk': pathlib.Path('EMSDK_VERSION').read_text().strip(),
              'upstream': subprocess.check_output(['git', '-C', 'upstream/melee-unlocked', 'rev-parse', 'HEAD'], text=True).strip(),
              'runner': platform.platform(),
              'node': subprocess.check_output(['node', '--version'], text=True).strip(),
              'native': json.loads((root / 'native-bench.json').read_text()),
              'wasm': json.loads((root / 'wasm-bench.json').read_text()),
          }
          output = json.dumps(result, indent=2) + '\n'
          (root / 'bench.json').write_text(output)
          print(output)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('Benchmark (no performance threshold):\n```json\n' + output + '```\n')
          PY
      - name: Publish the module and its x86 digests for the arm64 job
        shell: bash
        run: |
          # The arm64 job runs *this* module rather than building its own: two builds would
          # differ in the toolchain as well as in the engine, and the engine is the question.
          cp wasm-probe/wasm.sha256 wasm-probe/out/wasm/x86-wasm.sha256
          cp wasm-probe/native.sha256 wasm-probe/out/wasm/x86-native.sha256
          cp wasm-probe/bench.json wasm-probe/out/wasm/x86-bench.json
          du -sh wasm-probe/out/wasm
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-probe-module
          path: wasm-probe/out/wasm
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-probe-x86-dump
          # The x86 result dump, 64 MB. The arm64 job classifies its own dump against this
          # one, which is what turns "the digests differ" into a named divergence: the same
          # module, one engine version, and the first triple of each kind that differs.
          path: wasm-probe/wasm.bin
          if-no-files-found: error
          retention-days: 3
      - name: Classify FMA divergences and gate
        shell: bash
        run: |
          # No --allow-nan-payload-differences: CI enforces bit-exactness, and the
          # classification table is what makes a failure actionable.
          status=0
          wasm-probe/out/native/fma_vectors --compare wasm-probe/native.bin wasm-probe/wasm.bin \
            > wasm-probe/fma-divergence.txt || status=$?
          cat wasm-probe/fma-divergence.txt
          {
            echo "FMA divergence classification (native x86 intrinsics vs WASM fma()), exit ${status}:"
            echo '~~~'
            cat wasm-probe/fma-divergence.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import pathlib, re
          root = pathlib.Path('wasm-probe')
          report = (root / 'fma-divergence.txt').read_text()
          for side in ('native', 'wasm'):
              printed = (root / f'{side}.sha256').read_text().strip()
              assert re.fullmatch('[0-9a-f]{64}', printed), f'Malformed {side} hash'
              dumped = re.search(rf'^sha256 {side} ([0-9a-f]{{64}})$', report, re.M)
              assert dumped, f'Compare did not hash the {side} dump'
              assert dumped[1] == printed, f'{side} dump differs from what {side} hashed'
          PY
          # The gate is strict, so this step already fails on any divergence at all. This
          # second assertion says *which* classes are allowed to be the reason: the four
          # arithmetic classes must be exactly zero against the native reference, whatever
          # the NaN bit patterns do. It is what proves the shim guard (wasm/compat/fma.h)
          # works, and it fails with a precise message if a new arithmetic divergence
          # appears instead of only moving the exit status.
          python3 - <<'PY'
          import os, pathlib
          # Parse the main table explicitly -- its header, then its rows up to the blank
          # line -- instead of scanning the whole report with a regex: the report now also
          # prints per-path tables whose rows begin with the same kind names.
          lines = pathlib.Path('wasm-probe/fma-divergence.txt').read_text().splitlines()
          head = next(i for i, line in enumerate(lines)
                      if line.startswith('divergence') and 'gate' in line)
          kinds = ('nan-vs-number', 'nan-sign', 'nan-payload', 'zero-sign', 'subnormal', 'value')
          totals = {}
          for line in lines[head + 1:]:
              if not line.strip():
                  break
              cells = line.split()
              assert len(cells) >= 3, f'malformed classification row: {line!r}'
              assert cells[0] in kinds, f'unexpected row in the classification table: {line!r}'
              totals[cells[0]] = int(cells[2])
          missing = [kind for kind in kinds if kind not in totals]
          assert not missing, f'classification table is missing rows: {missing}'
          arithmetic = {k: totals[k] for k in ('nan-vs-number', 'zero-sign', 'subnormal', 'value')}
          print('arithmetic parity (native reference): ' + ', '.join(f'{k}={v}' for k, v in arithmetic.items()))
          assert not any(arithmetic.values()), f'arithmetic divergence vs native: {arithmetic}'
          residual = {k: totals[k] for k in ('nan-sign', 'nan-payload') if totals[k]}
          if residual:
              print(f'residual divergence, NaN bit patterns only: {residual}')
              print('PARKED: docs/OPEN_QUESTIONS.md Q7 decides whether NaN bits must match the reference.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('Arithmetic parity vs the native reference: 0 divergences in '
                        'nan-vs-number, zero-sign, subnormal, value.\n')
              if residual:
                  out.write(f'Residual divergence is confined to NaN bit patterns ({residual}). '
                            'That is what keeps this job red; it is parked as '
                            'docs/OPEN_QUESTIONS.md Q7 and is not a toolchain defect.\n')
          PY
          exit "$status"
      - name: The ring's layout is one definition (C and TypeScript agree byte for byte)
        shell: bash
        run: |
          # wasm/net/sab_ring_test.c is standalone C: no upstream include, no game data, no
          # -pthread. It is compiled here rather than by wasm/probe/CMakeLists.txt because that
          # project is C++ and the ring is the one probe that also has to be readable from
          # TypeScript, through web/src/net/sab_ring.ts and Node's type stripping.
          mkdir -p wasm-probe/out/ring
          # NODERAWFS: the driver reads the ring image this program writes with Node fs,
          # so the filesystem has to be the real one: MEMFS is invisible to Node (run 37006046793).
          emcc -std=c11 -O2 -Wall -Wextra -Werror \
            wasm/net/sab_ring_test.c -o wasm-probe/out/ring/sab_ring_test.js \
            -sNODERAWFS=1 -sENVIRONMENT=node -sEXIT_RUNTIME=1
          # The same file compiled with threads, compile only: this is the branch of the header
          # that publishes the two indices with __atomic_load_n/__atomic_store_n, and it is the
          # branch the real netcode thread will use. The layout test above cannot compile it,
          # because it is deliberately single-threaded.
          emcc -std=c11 -O2 -Wall -Wextra -Werror -pthread -c \
            wasm/net/sab_ring_test.c -o wasm-probe/out/ring/sab_ring_test.threads.o
          # The emcc output is CommonJS; the repository package.json says "type": "module".
          printf '{"type":"commonjs"}\n' > wasm-probe/out/ring/package.json
          node wasm/net/check_sab_ring.mjs wasm-probe/out/ring/sab_ring_test.js \
            wasm-probe/out/ring | tee wasm-probe/sab-ring.json
          {
            echo 'The C and TypeScript halves of the netcode ring agree byte for byte:'
            echo '~~~json'
            cat wasm-probe/sab-ring.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-probe
          path: |
            wasm-probe/bench.json
            wasm-probe/*-bench.json
            wasm-probe/*.sha256
            wasm-probe/fma-divergence.txt
          if-no-files-found: warn

  # The browser-to-browser question, which the native-vs-WASM comparison above does not
  # answer: the peers of a netcode match are WASM engines on different machines, not this
  # one Node build. The default NaN on ARM is positive where on x86 it is negative, so a
  # NaN sign difference is the candidate this job exists to look for (wasm/README.md,
  # "Next measurements" 2; docs/OPEN_QUESTIONS.md Q7).
  #
  # It runs the module the x86 job built instead of building its own: two builds would
  # differ in the toolchain as well as in the engine, and the engine is the question.
  # ubuntu-24.04-arm is a standard GitHub-hosted runner, listed for public and private
  # repositories alike (docs.github.com, "GitHub-hosted runners reference"); on this
  # repository, which is public, a run costs no minutes.
  probe-arm64:
    needs: probe
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: wasm-probe-module
          path: wasm-probe/out/wasm
      - uses: actions/download-artifact@v4
        with:
          name: wasm-probe-x86-dump
          path: wasm-probe/x86
      - name: Runner and engine version
        shell: bash
        run: |
          uname -m
          nproc
          free -m
          node --version
      - name: Run the same WASM modules on arm64
        shell: bash
        run: |
          # The corpus: the same 8,000,000 results, hashed in the same order and byte order,
          # so the two digests are comparable by construction. Every path is written from the
          # repository root, exactly as the x86 job writes its own: run 37093421011 had them
          # relative to the module directory and wrote into wasm-probe/out/ instead.
          node wasm-probe/out/wasm/fma_vectors.js --dump wasm-probe/arm64.bin \
            > wasm-probe/arm64-wasm.sha256
          node wasm-probe/out/wasm/bench.js > wasm-probe/arm64-wasm-bench.json
          # The upstream tests and the shim test, unchanged, under this engine, from their own
          # directory, as ctest runs them in the x86 job.
          for test in fma_shim_test port_load_test ram_watch_test ax_ucode_test texture_snapshot_test \
                      texture_compare_test_O2 texture_compare_test_Oz; do
            echo "== ${test}"
            (cd wasm-probe/out/wasm && node "${test}.js")
          done
      - name: Build the probe comparison tool on this architecture
        shell: bash
        run: |
          # The submodule is checked out for this step, not for the module: the port
          # comparison tool (wasm/probe/fma_vectors.cpp) is compiled here and pointed at
          # the two dumps, so a divergence is classified by the same code the x86 job
          # classifies with, rather than by a second implementation of the same rules.
          # The x86 job compiles its native baseline before the patch series and therefore
          # needs no include root; this one is compiled after it, because only the patched
          # ppc.h routes the four FMA operations away from <immintrin.h>. -I. is what
          # resolves the wasm/compat/fma.h that patch 0001 adds. --compare never calls
          # fmadd, so the arithmetic of this build is not what it is used for.
          bash scripts/apply_patches.sh
          g++ -std=c++17 -O2 -ffp-contract=off -fno-fast-math \
            -I. -Iwasm/compat -Iupstream/melee-unlocked/port/runtime/ppc \
            wasm/probe/fma_vectors.cpp -o wasm-probe/out/fma_vectors
      - name: Classify the cross-architecture divergence
        shell: bash
        run: |
          # In this invocation the tool labels one file "native" and the other "wasm". Here
          # "native" is WASM-x86 and "wasm" is WASM-arm64 -- one module, two engines. The
          # labels are the ones the tool already uses, unchanged, so this table means what
          # the x86 job table means: kind, input class, path, first triple of a kind.
          # This step is not the gate: the digest comparison below is, and it is what decides
          # the job. A tool that cannot read its inputs still leaves the job red there.
          wasm-probe/out/fma_vectors --compare wasm-probe/x86/wasm.bin wasm-probe/arm64.bin \
            > wasm-probe/arm64-divergence.txt || true
          cat wasm-probe/arm64-divergence.txt
      - name: Compare the two architectures
        shell: bash
        run: |
          # Both engine versions come from the runs, not from here: two Node versions would
          # make this a comparison between engines rather than between architectures.
          python3 - <<'PY'
          import json, pathlib, subprocess
          root = pathlib.Path('wasm-probe')
          result = {
              'node': subprocess.check_output(['node', '--version'], text=True).strip(),
              'wasm': json.loads((root / 'arm64-wasm-bench.json').read_text()),
          }
          (root / 'arm64-bench.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
          python3 scripts/phase0/compare_wasm_arch.py \
            --x86-wasm wasm-probe/out/wasm/x86-wasm.sha256 \
            --x86-native wasm-probe/out/wasm/x86-native.sha256 \
            --x86-bench wasm-probe/out/wasm/x86-bench.json \
            --arm64-wasm wasm-probe/arm64-wasm.sha256 \
            --arm64-bench wasm-probe/arm64-bench.json \
            --out wasm-probe/arm64-parity.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-probe-arm64
          path: |
            wasm-probe/arm64-parity.txt
            wasm-probe/arm64-divergence.txt
            wasm-probe/arm64-bench.json
            wasm-probe/arm64-wasm.sha256
          if-no-files-found: warn
