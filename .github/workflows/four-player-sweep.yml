name: Four-player sweep — which hand movement claims a door
# Exploratory companion to four-player-load.yml. Builds the same oracle-instrumented core and
# sweeps candidate hand movements for ports 3/4, reporting for each the final scene and how many
# HUD slots the renderer oracle saw. Ports 3/4 only get a character while their hand sits on the
# grid (mncharsel.c:3319), and every hand starts at y = -21.5 (mncharsel.c:4513).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/four-player/sweep_css.py'
      - '.github/workflows/four-player-sweep.yml'
permissions:
  contents: read
concurrency:
  group: four-player-sweep-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: echo "EMSDK_VERSION=$(cat EMSDK_VERSION)" >> "$GITHUB_ENV"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
      - name: Generate guest outside checkout
        env:
          GH_TOKEN: ${{ secrets.DOL_REPO_TOKEN }}
        run: scripts/phase0/fetch_and_recompile.sh offline "$RUNNER_TEMP/generated"
      - name: Build the node core with the four-player oracle
        run: |
          set -euo pipefail
          python3 experiments/four-player/install_oracle.py
          npm install -g binaryen@132.0.0
          emcmake cmake -S wasm/core -B "$RUNNER_TEMP/build" -G Ninja \
            -DMELEE_GEN="$RUNNER_TEMP/generated"
          cmake --build "$RUNNER_TEMP/build" --target melee_core_node --parallel 3
          mkdir -p "$RUNNER_TEMP/module"
          cp "$RUNNER_TEMP/build/melee_core_node.js" "$RUNNER_TEMP/module/"
          wasm-opt --enable-bulk-memory --enable-mutable-globals \
            --enable-nontrapping-float-to-int --enable-sign-ext --enable-exception-handling \
            -O2 "$RUNNER_TEMP/build/melee_core_node.wasm" \
            -o "$RUNNER_TEMP/module/melee_core_node.wasm"
      - name: Read private disc
        working-directory: ${{ runner.temp }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 r2 object get melee-phase0-disc/melee-ntsc102.iso --remote --file "$RUNNER_TEMP/disc.iso"
      - name: Which hand movement claims a door
        run: python3 experiments/four-player/sweep_css.py 2>&1 | tee "$RUNNER_TEMP/sweep.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-player-sweep
          path: ${{ runner.temp }}/sweep.log
          retention-days: 7
      - name: Remove private data
        if: always()
        run: rm -rf "$RUNNER_TEMP/generated" "$RUNNER_TEMP/dol" "$RUNNER_TEMP/disc.iso" "$RUNNER_TEMP/build" "$RUNNER_TEMP/module" "$RUNNER_TEMP"/sweep-*
