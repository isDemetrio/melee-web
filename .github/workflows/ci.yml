name: CI

# Everything in this repository is verified here, never on the operator's machine.
# The operator's VPS has no compiler, no Node toolchain and 3.7 GB of RAM; running a
# build there takes the machine down. See docs/AGENT_RULES.md rule 2 and 3.

on:
  # The account is on the free plan with a private repository, so Actions minutes come out of a
  # 2,000-minute monthly allowance (docs/AGENT_RULES.md, CI budget). A `push` trigger on every
  # branch duplicated every pull-request run: the same commit fires the push event and the
  # pull_request event, which measured out at two runs per push. Branches are verified by their
  # pull request; main is verified again after the merge.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repo hygiene and workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assert the upstream pin has not drifted
        run: |
          set -euo pipefail
          expected=$(grep -oE '[0-9a-f]{40}' docs/UPSTREAM_PIN.md | head -1)
          actual=$(git -C upstream/melee-unlocked rev-parse HEAD)
          echo "expected: $expected"
          echo "actual:   $actual"
          test "$expected" = "$actual"

      - name: Reject game data in the git index
        run: python scripts/check_no_game_data.py --all

      - name: The technical maps cite files and lines that exist
        # docs/PLAN_BREAKDOWN.md T1's machine acceptance, in the job that already checks the
        # submodule out: a citation is a claim about the pinned upstream, so a `path:N-M` that runs
        # past the end of its file is a wrong claim, not a formatting slip. The two criteria T1
        # states for the maps as they were planned -- a row per file, a disposition cell -- do not
        # apply to the narrative maps that were written; scripts/check_docs.py says so.
        run: python scripts/check_docs.py

      - name: Unit tests for the hygiene gate
        run: python -m unittest discover -s scripts/tests -v

      - name: Deploy and upload guards
        # Every case ends in a refusal or a dry run: this proves the scripts that can
        # publish something fail closed, without any Cloudflare credentials.
        run: bash scripts/tests/test_deploy_guard.sh

      - name: Phase 0 checkpoint runner guards
        # run_checkpoints.sh is the one script that writes a game-derived trace. Every case
        # ends in a refusal or in a dry run, so this needs no disc image and executes nothing.
        run: bash scripts/tests/test_phase0_runner.sh

      - name: Device tunnel guards
        # device_test_serve.sh starts the spike server and a cloudflared tunnel for a device
        # session. cloudflared is a stub there and the disc is a sparse zero file, so no tunnel,
        # no ISO and no game data is involved.
        run: bash scripts/tests/test_device_test_serve.sh

      - name: Validate workflow files
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  web:
    name: Web shell (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        id: install
        working-directory: web
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no lockfile yet, installing without one; commit the artifact below"
            npm install --no-audit --no-fund
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: web
        run: npx vitest run --reporter=verbose

      - name: Build
        working-directory: web
        run: npx vite build

      - name: The build lands where the deploy looks for it
        working-directory: web
        run: |
          set -euo pipefail
          # The artifact has to be web/dist: that is what scripts/deploy.sh uploads (and it
          # refuses to upload it without _headers), what scripts/build_web.sh checks after
          # the build, and what wrangler.toml names as pages_build_output_dir. A build that
          # writes anywhere else is a shell that cannot be deployed: the first real deploy
          # attempt refused with "web/dist/_headers is missing" (run 36843140022) because
          # the build wrote one level above the shell instead.
          test -f dist/_headers
          test -f dist/index.html
          # The spike page is the second entry of this same config, and the only place in the
          # repository where a module worker is constructed (web/src/spike/main.ts, opfs-store.ts,
          # with `{ type: 'module' }`). A config change that stops emitting it, or that turns the
          # worker format into a classic one, is caught here -- on every pull request -- which is
          # what lets web/vite.config.ts stay out of phase0-build.yml's path list.
          test -f dist/spike.html
          cmp dist/_headers public/_headers
          test ! -e ../dist
          echo "web/dist/_headers is byte-identical to web/public/_headers"

      - name: Report and bound the shell size
        working-directory: web
        run: |
          set -euo pipefail
          du -sh dist
          # Only the first-load shell is budgeted: sourcemaps and lazily-imported chunks
          # (the Supabase client) are not part of the first paint.
          node scripts/check-bundle-size.mjs --dir dist --budget-kb 1024

      - name: Upload the lockfile for the operator to commit
        if: steps.install.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: web/package-lock.json
          if-no-files-found: warn

  e2e:
    name: Browser tests (Chromium)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: web
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Build the shell the browser tests run against
        working-directory: web
        run: npx vite build

      - name: Run browser tests
        working-directory: web
        run: npx playwright test

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore

  deploy:
    name: Cloudflare Pages (skips without credentials)
    runs-on: ubuntu-latest
    # After the shell and the browser tests, and in the same workflow: a separate
    # deploy.yml could not depend on another workflow's jobs, and duplicating the build
    # there would publish a shell CI has not verified.
    needs: [web, e2e]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || secrets.CF_PAGES_PROJECT }}
      # The shell is not ready to be published: it needs the extracted assets (T8) before it can
      # load a game, and publishing it would put an empty page on the project's production address.
      # The credentials alone used to be the switch, so setting them turned this job on and made it
      # fail on every push and pull request; the switch is now explicit.
      CF_DEPLOY_SHELL: ${{ vars.CF_DEPLOY_SHELL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for Cloudflare credentials
        id: credentials
        run: |
          set -euo pipefail
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [ -n "$CF_PAGES_PROJECT" ] || missing+=(CF_PAGES_PROJECT)
          if ((${#missing[@]})); then
            echo "::notice::deploy skipped: no Cloudflare credentials (${missing[*]}); docs/OPEN_QUESTIONS.md Q3"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "${CF_DEPLOY_SHELL:-}" != "true" ]; then
            echo "::notice::deploy skipped: credentials are present but the shell deploy is off; set the repository variable CF_DEPLOY_SHELL=true when the shell can actually load a game (docs/DEPLOY.md section 3)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.enabled == 'true'
        with:
          node-version: '20'

      - name: Build the shell that gets deployed
        if: steps.credentials.outputs.enabled == 'true'
        working-directory: web
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npx tsc --noEmit
          npx vite build

      - name: Deploy
        if: steps.credentials.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          # deploy.sh refuses a dirty tree so the deployed shell is a commit rather than somebody's
          # working copy. The repository carries no lockfile, so npm writes one during the build:
          # that file is a byproduct, not a source edit. Drop it and print whatever git still
          # reports, so the guard keeps its meaning.
          rm -f web/package-lock.json
          git status --porcelain | sed 's/^/  before deploy: /'
          bash scripts/deploy.sh --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
