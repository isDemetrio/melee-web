name: Phase 0 — DOL pipeline and recompiler

# Phase 0 starts from the disc image, and the disc image is the operator's own. This job
# proves the whole chain in CI, on every run, instead of trusting that it worked once:
#
#   private DOL repo -> SHA-1 check -> port patch series -> recompiler -> generated C++
#
# It asserts the numbers the recompiler produced on the operator's VPS (144 translation
# units, 20,076 functions, guest image digest 7883e197ff19) so a silent change in the
# upstream pin, the patch series or the recompiler itself cannot pass unnoticed.
#
# The DOL and the generated tree are never written into the repository: the checkout goes
# to $RUNNER_TEMP, and the hygiene gate runs afterwards to prove it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'patches/**'
      - 'scripts/apply_patches.sh'
      - 'scripts/phase0/fetch_and_recompile.sh'
      - 'scripts/check_no_game_data.py'
      - 'upstream/melee-unlocked'
      - 'docs/UPSTREAM_PIN.md'
      - '.github/workflows/phase0-recompile.yml'

permissions:
  contents: read

concurrency:
  group: phase0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recompile:
    name: Recompiler on the real DOL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOL_REPO: isDemetrio/melee-orig-dol
      DOL_SHA1: 08e0bf20134dfcb260699671004527b2d6bb1a45
      DOL_SIZE: '4425184'
      GCT_BASE: '0x8065CC80'
      # Measured 2026-09-30. The recompiler's output is identical with and without
      # --gct-base: the code list carries 0 C0 caves, so there is nothing to translate at
      # the real addresses. The flag is still passed because it is what the release build
      # uses, and the job asserts the log no longer says the table was skipped.
      EXPECTED_TUS: '144'
      EXPECTED_FUNCTIONS: '20076'
      EXPECTED_IMAGE: 7883e197ff19
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Fetch, verify, patch and recompile (shared pipeline)
        env:
          GH_TOKEN: ${{ secrets.DOL_REPO_TOKEN }}
        run: scripts/phase0/fetch_and_recompile.sh release "$RUNNER_TEMP/generated"

      - name: Assert the measured output, not a plausible one
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/generated"
          tus=$(find "$out" -maxdepth 1 -name 'guest_*.cpp' ! -name 'guest_table.cpp' | wc -l)
          funcs=$(grep -h -c '^void f_' "$out"/guest_*.cpp | awk '{s+=$1} END {print s}')
          image=$(grep -oE 'image [0-9a-f]{12}' "$RUNNER_TEMP/recomp.log" | awk '{print $2}')
          echo "translation units: $tus"
          echo "functions:         $funcs"
          echo "guest image:       $image"
          test "$tus" = "$EXPECTED_TUS" || { echo "TU count changed: $tus" >&2; exit 1; }
          test "$funcs" = "$EXPECTED_FUNCTIONS" || { echo "function count changed: $funcs" >&2; exit 1; }
          test "$image" = "$EXPECTED_IMAGE" || { echo "guest image digest changed: $image" >&2; exit 1; }
          {
            echo "translation_units=$tus"
            echo "functions=$funcs"
            echo "guest_image=$image"
            echo "dol_sha1=$DOL_SHA1"
            echo "upstream_pin=$(git -C upstream/melee-unlocked rev-parse HEAD)"
            echo "runner=$(uname -srm)"
          } > "$RUNNER_TEMP/phase0-stats.txt"

      - name: Hygiene still holds after the run
        run: |
          set -euo pipefail
          git status --porcelain
          python3 scripts/check_no_game_data.py --all

      - name: Read the pinned emsdk version
        run: |
          set -euo pipefail
          version=$(tr -d '\n' < EMSDK_VERSION)
          test -n "$version"
          echo "EMSDK_VERSION=$version" >> "$GITHUB_ENV"

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Compile a generated TU with emcc and with the host compiler (P0-01)
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/generated"
          # The smallest and the largest emitted TU: the first proves the toolchain works at
          # all, the second is where a huge function would bite (PLAN_BREAKDOWN R3).
          # guest_table.cpp is excluded: it is the dispatch table, not a guest function, and
          # measuring it would report the wrong thing as "the biggest translation unit".
          # awk, not `sort | head`: under `set -o pipefail` a `head` that closes the pipe
          # makes sort die of SIGPIPE and fails the step (it did, on 2026-09-30).
          smallest="$out/guest_000.cpp"
          largest=$(find "$out" -maxdepth 1 -name 'guest_*.cpp' ! -name 'guest_table.cpp' \
            -printf '%s %p\n' | awk '$1+0 > m { m = $1+0; p = $2 } END { print p }')
          read -ra COMMON <<< "-std=c++17 -O2 -ffp-contract=off -fno-fast-math \
            -Iwasm/compat -I. -I$out -Iupstream/melee-unlocked/port/runtime/ppc \
            -Iupstream/melee-unlocked/port/runtime/hle"
          for tu in "$smallest" "$largest"; do
            name=$(basename "$tu" .cpp)
            for cc in "em++ -fwasm-exceptions" "g++"; do
              read -ra CMD <<< "$cc"
              compiler="${CMD[0]}"
              tag="${compiler%%+*}"
              obj="$RUNNER_TEMP/$name.$tag.o"
              /usr/bin/time -v -o "$RUNNER_TEMP/time-$name-$tag.txt" \
                "${CMD[@]}" "${COMMON[@]}" -c "$tu" -o "$obj"
              wall=$(awk -F': ' '/Elapsed \(wall clock\)/ {print $2}' "$RUNNER_TEMP/time-$name-$tag.txt")
              rss=$(awk -F': ' '/Maximum resident set size/ {print $2}' "$RUNNER_TEMP/time-$name-$tag.txt")
              bytes=$(stat -c%s "$obj")
              echo "$compiler $name: wall=$wall rss=${rss}kB object=${bytes}B"
              echo "$tag $name: wall=$wall rss_kb=$rss object_bytes=$bytes" \
                >> "$RUNNER_TEMP/phase0-stats.txt"
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: phase0-stats
          path: ${{ runner.temp }}/phase0-stats.txt
          if-no-files-found: error
