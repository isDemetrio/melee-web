<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Melee P0-10 spike</title></head>
<body>
<h1>Melee checkpoint spike</h1>
<label>Local disc image <input id="iso" type="file"></label>
<label>Native reference CSV <input id="reference" type="file" accept=".csv"></label>
<button id="run">Run</button>
<p id="core"></p><p id="status"></p>
<!--
  The heartbeat (src/spike/heartbeat.ts): the frame a run has reached and how long ago, while it runs,
  and -- after a reload -- where the last run that never finished had got to. "partial report" saves
  what the page has of a run that is still going: the beats, the log and the last renderer counts.
-->
<p id="heartbeat"></p><button id="partial" hidden>partial report JSON</button>
<pre id="log"></pre><pre id="stats"></pre><p id="compare"></p>
<a id="download" hidden>result JSON</a>
<!--
  The renderer. Empty unless the page is opened with ?canvas (a run draws into a canvas here through
  the core's WebGPU backend) or ?gx-selftest (the render test); #render is what the renderer reports.
-->
<div id="screen"></div><pre id="render"></pre>
<!--
  The disc cache. The operator downloads the 1.36 GiB disc once into this origin's own storage
  (OPFS) and then runs from it, instead of handing the file selector the same image on every run.
  The two lines below say what the cache holds and how far a download is; the buttons are the only
  way the page ever writes or deletes those bytes.
-->
<section>
  <h2>Disc cache</h2>
  <button id="fetch-disc">Download the disc into this browser</button>
  <button id="delete-disc">Delete the cached disc</button>
  <p id="disc-status">disc cache: unknown</p>
  <p id="disc-progress"></p>
</section>
<script type="module" src="/src/spike/main.ts"></script>
</body></html>
